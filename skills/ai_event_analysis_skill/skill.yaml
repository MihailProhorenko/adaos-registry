name: ai_event_analysis_skill
version: 0.2.1
description: Research skill for measurable AI/ML analysis of AdaOS operational event
  windows.
runtime:
  python: '3.11'
webui_owner: shared
data_projections:
- scope: webspace
  slot: ai_event_analysis.summary
  targets:
  - backend: yjs
    path: data/ai_event_analysis/summary
- scope: webspace
  slot: ai_event_analysis.dataset
  targets:
  - backend: yjs
    path: data/ai_event_analysis/dataset
- scope: webspace
  slot: ai_event_analysis.metrics
  targets:
  - backend: yjs
    path: data/ai_event_analysis/metrics
- scope: webspace
  slot: ai_event_analysis.experiments
  targets:
  - backend: yjs
    path: data/ai_event_analysis/experiments
- scope: webspace
  slot: ai_event_analysis.windows
  targets:
  - backend: yjs
    path: data/ai_event_analysis/windows
- scope: webspace
  slot: ai_event_analysis.charts
  targets:
  - backend: yjs
    path: data/ai_event_analysis/charts
events:
  subscribe:
  - webio.stream.snapshot.requested
  - ai_event_analysis.evaluate_requested
  publish:
  - ai_event_analysis.evaluation.completed
tools:
- name: get_lab_snapshot
  description: Return the current AI event-analysis research task snapshot.
  entry: handlers.main:get_lab_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - snapshot
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
- name: run_demo_evaluation
  description: Evaluate the built-in rule baseline on the synthetic event-window dataset.
  entry: handlers.main:run_demo_evaluation
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - result
    properties:
      ok:
        type: boolean
      result:
        type: object
- name: evaluate_windows
  description: Evaluate custom labeled event windows with the rule baseline.
  entry: handlers.main:evaluate_windows
  input_schema:
    type: object
    properties:
      windows:
        type: array
        items:
          type: object
  output_schema:
    type: object
    required:
    - ok
    - result
    properties:
      ok:
        type: boolean
      result:
        type: object
- name: import_local_logs
  description: Import and redact local AdaOS log lines into event evidence records.
  entry: handlers.main:import_local_logs
  input_schema:
    type: object
    properties:
      path:
        type: string
      max_lines:
        type: integer
  output_schema:
    type: object
    required:
    - ok
    - records
    - summary
    properties:
      ok:
        type: boolean
      records:
        type: array
      summary:
        type: object
- name: build_event_windows
  description: Build event-window records from imported evidence records or local
    logs.
  entry: handlers.main:build_event_windows
  input_schema:
    type: object
    properties:
      records:
        type: array
        items:
          type: object
      window_seconds:
        type: integer
      node_id:
        type: string
      subnet_id:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - result
    properties:
      ok:
        type: boolean
      result:
        type: object
- name: export_event_windows_jsonl
  description: Export event-window records as a JSONL dataset file.
  entry: handlers.main:export_event_windows_jsonl
  input_schema:
    type: object
    properties:
      windows:
        type: array
        items:
          type: object
      path:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - export
    properties:
      ok:
        type: boolean
      export:
        type: object
updated_at: '2026-05-29T09:22:24+00:00'

