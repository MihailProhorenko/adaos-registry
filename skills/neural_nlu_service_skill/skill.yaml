name: neural_nlu_service_skill
version: 0.2.13
description: Local neural intent detector service for AdaOS NLU pipeline
runtime:
  kind: service
  env:
    mode: venv
    python: '3.11'
dependencies:
- --extra-index-url
- https://download.pytorch.org/whl/cpu
- torch==2.12.0+cpu
- numpy
- faiss-cpu
service:
  host: 127.0.0.1
  port: 18091
  command:
  - -m
  - handlers.main
  healthcheck:
    path: /health
    timeout_ms: 1000
permissions:
- network
events:
  subscribe:
  - nlp.intent.detect.neural
  publish:
  - nlp.intent.detected
  - nlp.intent.detect.rasa
updated_at: '2026-05-26T14:01:19+00:00'

