name: infra_access_skill
version: 0.21.3
entry: handlers/main.py
runtime:
  python: '3.11'
  activation:
    mode: lazy
    startup_allowed: true
    background_refresh: false
    when:
      scenarios_active:
      - web_desktop
      client_presence: true
      webspace_scope: active
description: Skill-mediated operational surface for managed infra access, observability,
  and Root MCP token workflows.
dependencies: []
events:
  subscribe:
  - sys.ready
  - desktop.webspace.refresh
  - desktop.webspace.reload
  - desktop.webspace.reloaded
  - desktop.scenario.set
  - skills.activated
  - operations.
data_projections:
- scope: subnet
  slot: infra_access.snapshot
  targets:
  - backend: yjs
    path: data/infra_access
lifecycle:
  drain: infra_access_runtime_drain
  dispose: infra_access_runtime_dispose
default_tool: get_snapshot
tools:
- name: infra_access_runtime_drain
  description: Stop transient refresh work and clear infra access caches during runtime
    drain.
  entry: handlers.main:infra_access_runtime_drain
  input_schema:
    type: object
    properties:
      reason:
        type: string
  output_schema:
    type: object
- name: infra_access_runtime_dispose
  description: Dispose infra access projection workers and clear transient caches.
  entry: handlers.main:infra_access_runtime_dispose
  input_schema:
    type: object
    properties:
      reason:
        type: string
  output_schema:
    type: object
- name: get_snapshot
  description: Return the current infra_access UI snapshot with Root MCP connection
    metadata.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
      target_id:
        type:
        - string
        - 'null'
      target_node_id:
        type:
        - string
        - 'null'
      node_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
- name: refresh_snapshot
  description: Refresh and project the infra_access UI snapshot.
  entry: handlers.main:refresh_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
      target_id:
        type:
        - string
        - 'null'
      target_node_id:
        type:
        - string
        - 'null'
      node_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
- name: issue_codex_connection
  description: Issue a fresh MCP session lease for VS Code Codex and return connection
    details.
  entry: handlers.main:issue_codex_connection
  input_schema:
    type: object
    properties:
      target_id:
        type:
        - string
        - 'null'
      capability_profile:
        type: string
      ttl_seconds:
        type: integer
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
exports: {}
updated_at: '2026-05-22T14:17:57+00:00'

